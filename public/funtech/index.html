    <script>
      // Ensure the experience always starts at the Poster (Monitor) scene
      if (!location.search.includes('at=')) {
        const url = new URL(location.href);
        url.searchParams.set('at', 'poster');
        history.replaceState(null, '', url.toString());
      }

      // Floating button to seamlessly bridge into Part 2 (Bee Story)
      window.addEventListener('DOMContentLoaded', () => {
        const btn = document.createElement('button');
        btn.innerHTML = '<span style="display:inline-block; margin-right:6px;">🐝</span> <span>TRANSITION TO BEE STORY</span> <span style="font-size:14px; margin-left:6px;">➔</span>';
        btn.style.cssText = `
          position: fixed;
          bottom: 24px;
          right: 24px;
          z-index: 999999;
          background: linear-gradient(135deg, #f59e0b, #d97706);
          color: #000000;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
          font-weight: 900;
          font-size: 11px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          padding: 12px 22px;
          border-radius: 9999px;
          border: 2px solid #ffffff;
          box-shadow: 0 0 30px rgba(245, 158, 11, 0.7);
          cursor: pointer;
          display: flex;
          align-items: center;
          transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        `;
        btn.onmouseenter = () => {
          btn.style.transform = 'scale(1.06)';
          btn.style.boxShadow = '0 0 40px rgba(245, 158, 11, 0.9)';
        };
        btn.onmouseleave = () => {
          btn.style.transform = 'scale(1)';
          btn.style.boxShadow = '0 0 30px rgba(245, 158, 11, 0.7)';
        };
        btn.onclick = () => {
          window.parent.postMessage({ type: 'CELESTIUS_ADVANCE_TO_BEE' }, '*');
        };
        document.body.appendChild(btn);

        // Auto-advance listener when the run concludes
        window.addEventListener('keydown', (e) => {
          if (e.key === 'b' || e.key === 'B') {
            window.parent.postMessage({ type: 'CELESTIUS_ADVANCE_TO_BEE' }, '*');
          }
        });
      });
    </script>
